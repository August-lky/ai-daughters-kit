# ============================================================================
# dsh-bili-whale —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（本地开发，link 到源码目录）：
#   dsh plugin --profile desktop add "link:C:\\Users\\<你>\\.dsh\\plugins\\dsh-bili-whale"
# 或发布后：
#   dsh plugin --profile desktop add dsh-bili-whale
#
# ⚠️ `name:` 必须与安装后的**包名**完全一致（这里是 dsh-bili-whale），否则表现为
#    「装上了但设置页 404」。
# 装完后设置页在：http://127.0.0.1:<DSH 端口>/dsh-bili/  （DSH 里点"插件 → 养鱼"）
# ============================================================================

- insert:
    - id: dsh-bili-whale
      name: dsh-bili-whale
