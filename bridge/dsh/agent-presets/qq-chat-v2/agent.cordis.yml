# ── QQ 安全硬边界 ────────────────────────────────────────────────────────────
# 隐藏开发/管理工具，并在执行期用白名单拒绝任何越权工具调用。

- id: qq-tool-restrict
  name: ./qq-tool-restrict.mjs
  config: {}

# ── 上下文管理（保留，避免长聊爆上下文） ────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 50000
        headChars: 45000
        tailChars: 2000
